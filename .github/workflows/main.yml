name: Build AVIATOR Sync iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project AviatorSync.xcodeproj \
            -scheme AviatorSync \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Create and verify IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)

          echo "App found at: $APP_PATH"
          test -n "$APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry AVIATOR-Sync-iPhone-v4.4-unsigned.ipa Payload

          echo "Checking IPA:"
          unzip -l AVIATOR-Sync-iPhone-v4.4-unsigned.ipa | head -30

          unzip -t AVIATOR-Sync-iPhone-v4.4-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AVIATOR-Sync-iPhone-v4.4-unsigned
          path: AVIATOR-Sync-iPhone-v4.4-unsigned.ipa
          if-no-files-found: error
